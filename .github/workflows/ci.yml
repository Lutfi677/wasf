name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Install poppler
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils

      - name: Install dependencies
        run: python -m pip install ".[dev,samples,azure,ocr]"

      - name: Generate samples
        run: |
          python eval/samples_tools/make_samples.py
          python eval/samples_tools/make_after.py

      - name: Run checks
        run: python scripts/check.py

      - name: Scan for secrets
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
